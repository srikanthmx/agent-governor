agents:
  - id: shell
    label: Shell Adapter
    type: shell
    enabled: true
    command: sh
    args:
      - -lc
      - "cat \"$AGENT_GOVERNOR_PROMPT_FILE\""
    capabilities:
      - requirements
      - design
      - implementation
      - review
    preferredRoles:
      - requirements_writer
      - reviewer

  - id: opencode
    label: OpenCode
    type: opencode
    enabled: false
    detectCommand: opencode
    command: opencode
    args:
      - run
      - --prompt-file
      - "{promptFile}"
    capabilities:
      - requirements
      - design
      - implementation
      - review
    preferredRoles:
      - planner
      - implementer
      - reviewer

  - id: codex
    label: Local Codex
    type: shell
    enabled: false
    detectCommand: codex
    command: sh
    models:
      - gpt-5.5
      - gpt-5
      - gpt-5-mini
      - o3
      - o4-mini
    defaultModel: gpt-5.5
    args:
      - -lc
      - 'codex exec ${AGENT_GOVERNOR_MODEL:+--model "$AGENT_GOVERNOR_MODEL"} --skip-git-repo-check --sandbox danger-full-access "$(cat "$AGENT_GOVERNOR_PROMPT_FILE")"'
    capabilities:
      - requirements
      - design
      - implementation
      - review
    preferredRoles:
      - requirements_writer
      - planner
      - implementer
      - reviewer

  - id: claude
    label: Local Claude
    type: shell
    enabled: false
    detectCommand: claude
    command: sh
    args:
      - -lc
      - 'claude -p "$(cat "$AGENT_GOVERNOR_PROMPT_FILE")"'
    capabilities:
      - requirements
      - design
      - implementation
      - review
    preferredRoles:
      - requirements_writer
      - planner
      - implementer
      - reviewer

  - id: gemini
    label: Local Gemini
    type: shell
    enabled: false
    detectCommand: gemini
    command: sh
    args:
      - -lc
      - 'gemini -p "$(cat "$AGENT_GOVERNOR_PROMPT_FILE")"'
    capabilities:
      - requirements
      - design
      - implementation
      - review
    preferredRoles:
      - requirements_writer
      - planner
      - implementer
      - reviewer

  - id: aider
    label: Aider
    type: aider
    enabled: false
    detectCommand: aider
    capabilities:
      - implementation

  - id: cline
    label: Cline
    type: cline
    enabled: false
    detectCommand: cline
    capabilities:
      - design
      - review

roles:
  requirements_writer:
    preferred: [codex, claude, gemini, opencode, shell]
    fallback: [aider]
  planner:
    preferred: [codex, claude, gemini, opencode]
    fallback: [cline, shell]
  implementer:
    preferred: [codex, claude, gemini, opencode, aider]
    fallback: [shell]
  reviewer:
    preferred: [codex, claude, gemini, opencode, cline]
    fallback: [shell]
