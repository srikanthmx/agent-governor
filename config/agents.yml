agents:
  - id: shell
    label: Shell Diagnostic
    type: shell
    enabled: false
    command: sh
    args:
      - -lc
      - "cat \"$AGENT_GOVERNOR_PROMPT_FILE\""
    capabilities:
      - requirements
      - design
      - implementation
      - review
    preferredRoles:
      - requirements_writer
      - reviewer

  - id: opencode
    label: OpenCode
    type: opencode
    enabled: false
    detectCommand: opencode
    command: opencode
    args:
      - run
      - --prompt-file
      - "{promptFile}"
    capabilities:
      - requirements
      - design
      - implementation
      - review
    preferredRoles:
      - planner
      - implementer
      - reviewer

  - id: codex
    label: Local Codex
    type: shell
    enabled: false
    detectCommand: codex
    command: sh
    models:
      - gpt-5.5
      - gpt-5
      - gpt-5-mini
      - o3
      - o4-mini
    defaultModel: gpt-5.5
    args:
      - -lc
      - 'codex exec ${AGENT_GOVERNOR_MODEL:+--model "$AGENT_GOVERNOR_MODEL"} --skip-git-repo-check --sandbox danger-full-access "$(cat "$AGENT_GOVERNOR_PROMPT_FILE")"'
    capabilities:
      - requirements
      - design
      - implementation
      - review
    preferredRoles:
      - requirements_writer
      - planner
      - implementer
      - reviewer

  - id: claude
    label: Local Claude
    type: shell
    enabled: false
    detectCommand: claude
    command: sh
    args:
      - -lc
      - 'claude -p "$(cat "$AGENT_GOVERNOR_PROMPT_FILE")"'
    capabilities:
      - requirements
      - design
      - implementation
      - review
    preferredRoles:
      - requirements_writer
      - planner
      - implementer
      - reviewer

  - id: gemini
    label: Local Gemini
    type: shell
    enabled: false
    detectCommand: gemini
    command: sh
    args:
      - -lc
      - 'gemini --skip-trust -p "$(cat "$AGENT_GOVERNOR_PROMPT_FILE")"'
    capabilities:
      - requirements
      - design
      - implementation
      - review
    preferredRoles:
      - requirements_writer
      - planner
      - implementer
      - reviewer

  - id: ollama
    label: Local Ollama
    type: shell
    enabled: false
    detectCommand: ollama
    command: sh
    models:
      - llama3.1
      - qwen2.5-coder
      - mistral
    defaultModel: llama3.1
    args:
      - -lc
      - 'ollama run "${AGENT_GOVERNOR_MODEL:-llama3.1}" "$(cat "$AGENT_GOVERNOR_PROMPT_FILE")"'
    capabilities:
      - requirements
      - design
      - review
    preferredRoles:
      - requirements_writer
      - planner
      - reviewer

  - id: goose
    label: Goose
    type: shell
    enabled: false
    detectCommand: goose
    command: sh
    args:
      - -lc
      - 'goose run -t "$(cat "$AGENT_GOVERNOR_PROMPT_FILE")"'
    capabilities:
      - requirements
      - design
      - implementation
      - review
    preferredRoles:
      - requirements_writer
      - planner
      - implementer
      - reviewer

  - id: qwen-code
    label: Qwen Code
    type: shell
    enabled: false
    detectCommand: qwen
    command: sh
    args:
      - -lc
      - 'qwen -p "$(cat "$AGENT_GOVERNOR_PROMPT_FILE")"'
    capabilities:
      - requirements
      - design
      - implementation
      - review
    preferredRoles:
      - requirements_writer
      - planner
      - implementer
      - reviewer

  - id: aider
    label: Aider
    type: aider
    enabled: false
    detectCommand: aider
    capabilities:
      - implementation

  - id: cline
    label: Cline
    type: cline
    enabled: false
    detectCommand: cline
    capabilities:
      - design
      - review

  - id: kiro
    label: Kiro
    type: shell
    enabled: false
    detectCommand: kiro
    command: kiro
    executionMode: interactive
    args:
      - --reuse-window
      - "{repoPath}"
      - "{promptFile}"
    capabilities:
      - interactive
    preferredRoles:
      - interactive

  - id: antigravity
    label: Google Antigravity
    type: shell
    enabled: false
    detectCommand: /Applications/Antigravity IDE.app/Contents/Resources/app/bin/antigravity-ide
    command: /Applications/Antigravity IDE.app/Contents/Resources/app/bin/antigravity-ide
    executionMode: interactive
    args:
      - --reuse-window
      - "{repoPath}"
      - "{promptFile}"
    capabilities:
      - interactive
    preferredRoles:
      - interactive

  - id: cursor
    label: Cursor
    type: shell
    enabled: false
    detectCommand: cursor
    command: cursor
    executionMode: interactive
    args:
      - --reuse-window
      - "{repoPath}"
      - "{promptFile}"
    capabilities:
      - interactive
    preferredRoles:
      - interactive

  - id: windsurf
    label: Windsurf
    type: shell
    enabled: false
    detectCommand: windsurf
    command: windsurf
    executionMode: interactive
    args:
      - --reuse-window
      - "{repoPath}"
      - "{promptFile}"
    capabilities:
      - interactive
    preferredRoles:
      - interactive

  - id: zed
    label: Zed
    type: shell
    enabled: false
    detectCommand: zed
    command: zed
    executionMode: interactive
    args:
      - "{repoPath}"
      - "{promptFile}"
    capabilities:
      - interactive
    preferredRoles:
      - interactive

  - id: code
    label: VS Code
    type: shell
    enabled: false
    detectCommand: /Applications/Visual Studio Code.app/Contents/Resources/app/bin/code
    command: /Applications/Visual Studio Code.app/Contents/Resources/app/bin/code
    executionMode: interactive
    args:
      - --reuse-window
      - "{repoPath}"
      - "{promptFile}"
    capabilities:
      - interactive
    preferredRoles:
      - interactive

roles:
  requirements_writer:
    preferred: [codex, claude, gemini, opencode, goose, qwen-code, shell]
    fallback: [ollama, aider]
  planner:
    preferred: [codex, claude, gemini, opencode, goose, qwen-code]
    fallback: [ollama, cline, shell]
  implementer:
    preferred: [codex, claude, gemini, opencode, goose, qwen-code, aider]
    fallback: [shell]
  reviewer:
    preferred: [codex, claude, gemini, opencode, goose, qwen-code, cline]
    fallback: [ollama, shell]
